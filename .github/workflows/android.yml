# Commit fijado de Vita3K: 3e43bc803a04c775737a3474e0d54f3e10ca61bf
# (master, 2026-11-07). Para actualizarlo: cambiar VITA3K_PIN abajo
# Y el Java de SDL vendorizado (app/src/main/java/org/libsdl/app/)
# al commit fijado como external/sdl en ese pin, o la interfaz
# Java<->nativa de SDL puede no coincidir.

name: Android CI — Child of Light Launcher (sin PC)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-ci-main
  cancel-in-progress: false

env:
  VITA3K_PIN: 3e43bc803a04c775737a3474e0d54f3e10ca61bf
  ANDROID_NDK_VERSION: 29.0.14206865

jobs:
  # --- Etapa 1, sin tocar (sigue verde aunque el nativo falle) ---
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Build release APK (sin firmar en Etapa 1)
        run: gradle :app:assembleRelease --stacktrace

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: child-of-light-launcher-apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error

  # --- Etapa 2: núcleo Vita3K embebido ---
  build-native:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout launcher
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"
      - name: Set VCPKG_ROOT (lo exige vita3k/cmake/vcpkg_android.cmake)
        run: |
          VCPKG_ROOT=/usr/local/share/vcpkg
          if command -v vcpkg >/dev/null 2>&1; then
            CANDIDATE="$(dirname "$(readlink -f "$(command -v vcpkg)")")"
            [ -f "$CANDIDATE/scripts/buildsystems/vcpkg.cmake" ] && VCPKG_ROOT="$CANDIDATE"
          fi
          [ -f "$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" ] || { echo "ERROR: vcpkg.cmake no existe en $VCPKG_ROOT"; exit 1; }
          echo "VCPKG_ROOT=$VCPKG_ROOT" >> "$GITHUB_ENV"
          echo "VCPKG_ROOT=$VCPKG_ROOT"

      - name: Install NDK 29 + build tools (como .ci/setup-android.sh de upstream)
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null
          sdkmanager --install "platforms;android-35" "build-tools;36.0.0" "ndk;${ANDROID_NDK_VERSION}"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Clone Vita3K (commit fijado) + submódulos
        run: |
          for i in 1 2 3; do
            rm -rf app/src/main/cpp/vita3k
            git clone --depth 1 https://github.com/Vita3K/Vita3K.git app/src/main/cpp/vita3k && break
            echo "Intento $i de clonar Vita3K falló; reintentando en 30 s..."
            sleep 30
          done
          [ -d app/src/main/cpp/vita3k/.git ] || { echo "ERROR: no se pudo clonar Vita3K tras 3 intentos"; exit 1; }
          cd app/src/main/cpp/vita3k
          # --depth 1 clona la punta de master, no el pin: si upstream
          # avanzó desde el pin, el chequeo de abajo fallaría siempre.
          # Se trae el commit fijado y se deja el árbol en él.
          for i in 1 2 3; do
            git fetch --depth 1 origin "${VITA3K_PIN}" && break
            echo "Intento $i de traer ${VITA3K_PIN} falló; reintentando en 30 s..."
            sleep 30
          done
          git checkout "${VITA3K_PIN}"
          HEAD_SHA=$(git rev-parse HEAD)
          if [ "$HEAD_SHA" != "${VITA3K_PIN}" ]; then
            echo "ERROR: el clon de Vita3K está en $HEAD_SHA, se esperaba ${VITA3K_PIN}. Actualiza VITA3K_PIN (y el Java de SDL vendorizado) o fija el clon."
            exit 1
          fi
          git submodule update --init --recursive --depth 1
          # Vita3K comprueba submódulos con ${CMAKE_SOURCE_DIR}/.gitmodules, pero aquí CMAKE_SOURCE_DIR es app/src/main/cpp (adaptador). Reescribimos rutas con prefijo vita3k/.
          sed 's|^\(\s*path = \)|\1vita3k/|' .gitmodules > ../.gitmodules
          echo "Submódulos reescritos en ../.gitmodules: $(grep -c 'path = vita3k/' ../.gitmodules)"
          # Vita3K usa ${CMAKE_SOURCE_DIR} (= adaptador) para tools/, i18n/, external/, data/. Enlaces al árbol Vita3K.
          ln -s vita3k/tools ../tools
          ln -s vita3k/i18n ../i18n
          ln -s vita3k/external ../external
          ln -s vita3k/data ../data
          ls -l ../tools ../i18n ../external ../data
          echo "Vita3K en ${VITA3K_PIN} con submódulos."

      # Ronda 0.2.66 (Fase 2): parches del núcleo sobre el pin 3e43bc80.
      # Se aplican con git apply --check PRIMERO y el build es ROJO si
      # alguno no aplica: mejor un build rojo que un parche
      # silenciosamente ausente. Lista EXPLÍCITA en orden de aplicación
      # (el orden importa: aud-p2-1 toca config.h antes que cpu-05, y
      # hook1/g11-06 comparten screen_renderer.cpp). r1 va tras g11-05:
      # está rebasado sobre aud-p2-1/aud-p2-5 (mismos hunks en
      # sdl_audio.cpp, config.h, state.h y app_init.cpp); ni antes
      # que ellos ni encima sin rebase aplica. load-p1 va tras los
      # aud2 de rendimiento: está rebasado sobre los 15 + 3 (sus hunks
      # en config.h, state.h y settings.cpp van junto a los de
      # aud-p2-1/r1). Ronda 0.2.70: aud2-p1-13/aud2-p2-1/aud2-p2-3
      # (contadores + sleep, renderer.cpp/batch.cpp/texture.cpp) van
      # tras r1 y antes de load-p1; aud2-p1-12 (cubeb_audio.cpp),
      # aud2-p2-6 (audio.cpp) y aud2-render-surface-format
      # (screen_renderer.cpp) van tras load-p1 (ya no últimos: tras
      # ellos va aud3-mask-bit-disable): ninguno toca
      # config.h/state.h/settings.cpp/app.cpp, así que no interfiere
      # con el rebase de load-p1.
      # app/src/main/cpp/patches/; nunca patches/experimental/.
      # Las rutas dentro de cada .patch son relativas a la raíz del
      # CÓDIGO Vita3K, que vive en el subdirectorio vita3k/ del repo
      # (vita3k/kernel/..., vita3k/renderer/...): por eso se aplica
      # con --directory=vita3k desde la raíz del clon. Sin ese flag
      # el run #509 falló con "No such file or directory" (las rutas
      # kernel/... no existen en la raíz del repo).
      - name: Apply core patches (0.2.70)
        run: |
          cd app/src/main/cpp/vita3k
          for patch in \
            p3-jit-invalidate-on-module-reload.patch \
            p5-eye-plane-mali-guard.patch \
            hook1-present-counter.patch \
            g11-06-vsync-present-mode.patch \
            g11-03-deferred-unmap.patch \
            g11-09-pipeline-cache-save-on-exit.patch \
            c-01-texture-cache-vulkan.patch \
            c-02-shader-cache-vulkan.patch \
            aud-p2-1-audio-device-sample-frames.patch \
            cpu-05-remove-cpu-pool-size.patch \
            aud-p2-5-sdl-audio-drop.patch \
            aud-p2-3-ngs-system-init-error.patch \
            aud-p2-6-audio-ms-log.patch \
            g11-05-shader-manifest-per-mask.patch \
            r1-audio-sdl-exp.patch \
            aud2-p1-13-present-counter.patch \
            aud2-p2-1-batch-poll-sleep.patch \
            aud2-p2-3-staging-counter.patch \
            load-p1-skip-shader-precompile.patch \
            aud2-p1-12-cubeb-timeout.patch \
            aud2-p2-6-steady-clock.patch \
            aud2-render-surface-format.patch \
            aud3-mask-bit-disable.patch; do
            f="../patches/$patch"
            [ -f "$f" ] || { echo "ERROR: falta el parche $f"; exit 1; }
            git apply --check --directory=vita3k "$f" || { echo "ERROR: el parche $patch no aplica limpio sobre el pin ${VITA3K_PIN}"; exit 1; }
            git apply --directory=vita3k "$f" || { echo "ERROR: git apply falló para $patch"; exit 1; }
            echo "Parche aplicado: $patch"
          done
          echo "23 parches aplicados sobre ${VITA3K_PIN}."

      - name: Cache vcpkg (binaria, como upstream)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/vcpkg
            app/src/main/cpp/vita3k/vcpkg_installed
          key: vcpkg-arm64-${{ env.VITA3K_PIN }}-${{ env.ANDROID_NDK_VERSION }}-${{ hashFiles('app/src/main/cpp/vita3k/vcpkg.json', 'app/src/main/cpp/vita3k/CMakeLists.txt') }}
          restore-keys: |
            vcpkg-arm64-${{ env.VITA3K_PIN }}-

      - name: Install vcpkg deps (triplet arm64-android)
        run: |
          cd app/src/main/cpp/vita3k
          VCPKG_OK=0
          for i in 1 2 3; do
            if vcpkg install --triplet arm64-android; then VCPKG_OK=1; break; fi
            echo "Intento $i de vcpkg install falló; reintentando en 30 s..."
            sleep 30
          done
          [ "$VCPKG_OK" = 1 ] || { echo "ERROR: vcpkg install falló tras 3 intentos"; exit 1; }

      - name: Copy core assets (como .ci/build-android.sh de upstream)
        run: |
          mkdir -p app/src/main/assets
          rm -rf app/src/main/assets/data app/src/main/assets/shaders-builtin
          cp -r app/src/main/cpp/vita3k/data app/src/main/assets/data
          cp -r app/src/main/cpp/vita3k/vita3k/shaders-builtin app/src/main/assets/shaders-builtin

      # Sin "Run unit tests" aquí: los mismos tests ya corren en el job
      # `build` (no tocan código nativo: en JVM no hay .so y
      # Vita3kCoreBridge.available es false). Repetirlos solo alarga
      # el job nativo una invocación de Gradle.
      - name: Build debug APK (con núcleo)
        run: gradle :app:assembleDebug --stacktrace

      - name: Build release APK (sin firmar)
        run: gradle :app:assembleRelease --stacktrace

      - name: Report native lib size
        run: |
          # Los .so compilados por CMake viven en app/.cxx/<config>/<hash>/arm64-v8a
          # (Debug y RelWithDebInfo), NO en app/build: buscar ahí no medía nada (run #50).
          # OJO: el .so se llama libVita3K.so (mayúscula K, OUTPUT_NAME de
          # upstream) y find -name distingue mayúsculas: libvita3k.so no existe
          # (run #54). SDL3 va ESTÁTICO dentro de libVita3K.so (libSDL3.a), no
          # hay libSDL3.so: se lista el .a para confirmar que se enlazó.
          find app/.cxx -name "libVita3K.so" -exec ls -lh {} \;
          find app/.cxx -name "libSDL3.a" -exec ls -lh {} \;
          ls -lh app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/release/app-release-unsigned.apk
          # Páginas de 16 KiB: p_align debe ser 16384 en los LOAD de cada .so.
          # Se mide el .so EXTRAÍDO DEL APK (lo que se envía), no solo app/.cxx,
          # y el paso FALLA si el valor no es 0x4000 o si falta el .so.
          mkdir -p /tmp/apk-check && unzip -p app/build/outputs/apk/debug/app-debug.apk lib/arm64-v8a/libVita3K.so > /tmp/apk-check/libVita3K.so
          [ -s /tmp/apk-check/libVita3K.so ] || { echo "ERROR: libVita3K.so ausente en el APK debug"; exit 1; }
          for so in /tmp/apk-check/libVita3K.so $(find app/.cxx -name "libVita3K.so"); do
            echo "== $so =="
            readelf -W -l "$so" | grep LOAD
            readelf -W -l "$so" | awk '/LOAD/ { if ($NF != "0x4000") { print "ERROR: p_align " $NF " != 0x4000 en " FILENAME; exit 1 } }'
          done

      - name: Upload APKs (núcleo embebido)
        uses: actions/upload-artifact@v4
        with:
          name: child-of-light-launcher-apks-native
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
